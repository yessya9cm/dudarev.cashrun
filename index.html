function update(){if(paused)return;frame++;hero.vx=(keys.right?3.5:0)-(keys.left?3.5:0);hero.x+=hero.vx;if(keys.jump&&hero.onGround){hero.vy=-11.1;hero.onGround=false;keys.jump=false}hero.vy+=.48;hero.y+=hero.vy;hero.onGround=false;platforms.forEach(p=>{if(hero.x+hero.w>p.x&&hero.x<p.x+p.w&&hero.y+hero.h>=p.y&&hero.y+hero.h<=p.y+20&&hero.vy>=0){hero.y=p.y-hero.h;hero.vy=0;hero.onGround=true}});movingPlatforms.forEach(m=>{let x=m.x+Math.sin(frame*.025+m.phase)*m.range;if(hero.x+hero.w>x&&hero.x<x+m.w&&hero.y+hero.h>=m.y&&hero.y+hero.h<=m.y+19&&hero.vy>=0){hero.y=m.y-hero.h;hero.vy=0;hero.onGround=true}});if(hero.y>CH+30)damage();hazards.forEach(h=>{if(overlap(hero,h))damage()});coins.forEach(o=>{if(!o.taken&&Math.abs(hero.x+15-o.x)<25&&Math.abs(hero.y+23-o.y)<35){o.taken=true;let amount=o.type==='cash'?100:25;if(gear.backpack)amount+=10;if(gear.car)amount+=5;cash+=amount;score+=amount;save();sync()}});questionBlocks.forEach(q=>{if(!q.used&&Math.abs(hero.x+15-q.x)<28&&Math.abs(hero.y-q.y)<45){q.used=true;launchQuest()}});secrets.forEach(s=>{if(!s.found&&Math.abs(hero.x+15-s.x)<28&&Math.abs(hero.y-s.y)<40){s.found=true;cash+=350;score+=350;toast('Секретный тайник! +350 ₽')}});camera=Math.max(0,Math.min(hero.x-260,finishX-CW+190));if(hero.x>=finishX)levelComplete();if(hero.invincible>0)hero.invincible--}

function levelComplete(){paused=true;let reward=1200*levelNo;cash+=reward;score+=reward;save();open(`<h2>Уровень пройден!</h2><p>Бонус за финиш: <b>${reward.toLocaleString('ru-RU')} ₽</b></p><p>Следующая локация будет совершенно другой. Всего в игре 10 этапов.</p><button onclick="window.advanceLevel()">Следующий этап</button>`)}window.advanceLevel=()=>{levelNo=Math.min(levelNo+1,10);finishX=2500+(levelNo-1)*300;hero.x=65;hero.y=ground-hero.h;camera=0;lives=Math.min(3,lives+1);buildLevel();close();paused=false;save();sync();toast('Локация: '+worlds[levelNo-1].name)};
const storeItems=[{key:'backpack',name:'Школьный портфель',price:3500,desc:'Вместительный рюкзак. Купюры дают +10 ₽ сверху.'},{key:'watch',name:'Золотые часы',price:12000,desc:'Покупка сейчас. Активная способность замедления появится в следующей сборке.'},{key:'blueglasses',name:'Очки с голубыми линзами',price:5000,desc:'Деловые вопросы приносят повышенную награду.'},{key:'chain',name:'Золотая цепь',price:8000,desc:'Увеличивает бонусы за деловые задания на 15%.'},{key:'vip',name:'VIP-карта',price:20000,desc:'Пропуск к секретным маршрутам (пока коллекционный флаг).'},{key:'car',name:'Машина',price:25000,desc:'Небольшой бонус к сбору. Большой автомобильный этап — будущая зона.'}];
function shop(){paused=true;open(`<h2>Магазин</h2><p>Доступный капитал: <b>${cash.toLocaleString('ru-RU')} ₽</b></p><div class="grid">${storeItems.map(it=>`<div class="tile"><h3>${it.name}</h3><p>${it.desc}</p><div class="price">${it.price.toLocaleString('ru-RU')} ₽</div>${gear[it.key]?'<button disabled>Куплено</button>':`<button ${cash<it.price?'disabled':''} onclick="window.purchase('${it.key}',${it.price})">Купить</button>`}</div>`).join('')}</div><p><button class="secondary" onclick="window.closePanel()">Закрыть</button></p>`)}window.purchase=(key,price)=>{if(cash<price||gear[key])return;cash-=price;gear[key]=true;save();sync();shop();toast('Приобретено: '+storeItems.find(x=>x.key===key).name)};
function wardrobe(){paused=true;open(`<h2>Гардероб</h2><p>Выбери внешний вид персонажа. Одежда пока косметическая, отдельные предметы магазина отображаются на спрайте.</p><div class="grid">${skinNames.map((name,i)=>`<div class="tile"><h3>${name}</h3><p>${['Классический комплект','Большая тройка — намеренно великовата','Кричащий брендовый принт','Бежевая футболка с красными перцами'][i]}</p><button onclick="window.equipSkin(${i})">${skin===i?'Надет':'Надеть'}</button></div>`).join('')}</div><p><button class="secondary" onclick="window.closePanel()">Закрыть</button></p>`)}window.equipSkin=i=>{skin=i;save();close();paused=false;toast('Образ обновлён')};
function levelMap(){paused=true;open(`<h2>Карта локаций</h2><div class="grid">${worlds.map((w,i)=>`<div class="tile"><h3>${i+1}. ${w.name}</h3><p>${i<levelNo?'Открыто':'Открывается по мере прохождения'}</p><button ${i+1>levelNo?'disabled':''} onclick="window.jumpLevel(${i+1})">${i+1===levelNo?'Текущий уровень':'Перейти'}</button></div>`).join('')}</div><p><button class="secondary" onclick="window.closePanel()">Закрыть</button></p>`)}window.jumpLevel=n=>{levelNo=n;finishX=2500+(levelNo-1)*300;hero.x=70;hero.y=ground-hero.h;camera=0;buildLevel();save();close();paused=false;sync()};window.closePanel=()=>{close();paused=false};window.resumeGame=()=>{lives=3;hero.x=70;hero.y=ground-hero.h;paused=false;close();sync()};
document.getElementById('shop').onclick=shop;document.getElementById('wardrobe').onclick=wardrobe;document.getElementById('map').onclick=levelMap;document.getElementById('pause').onclick=()=>{paused=!paused;toast(paused?'Пауза':'Продолжаем')};document.getElementById('restart').onclick=()=>{if(!confirm('Сбросить весь прогресс, баланс и покупки?'))return;cash=0;score=0;levelNo=1;skin=0;gear={backpack:false,watch:false,blueglasses:false,chain:false,vip:false,car:false};lives=3;finishX=2600;hero.x=70;hero.y=ground-hero.h;buildLevel();save();sync();toast('Сохранение сброшено')};
// touch buttons keep movement alive while held
document.querySelectorAll('#left,#right').forEach(btn=>{let key=btn.id;btn.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>btn.addEventListener(ev,()=>keys[key]=false))});document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();keys.jump=true});
window.addEventListener('keydown',e=>{if(['ArrowRight','d','D'].includes(e.key))keys.right=true;if(['ArrowLeft','a','A'].includes(e.key))keys.left=true;if([' ','ArrowUp','w','W'].includes(e.key)){keys.jump=true;e.preventDefault()}});window.addEventListener('keyup',e=>{if(['ArrowRight','d','D'].includes(e.key))keys.right=false;if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if([' ','ArrowUp','w','W'].includes(e.key))keys.jump=false});buildLevel();sync();
if(window.Telegram&&window.Telegram.WebApp){const tg=window.Telegram.WebApp;tg.ready();tg.expand();try{tg.setHeaderColor('#0c101b');tg.setBackgroundColor('#0c101b')}catch(e){}}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script></body></html>
